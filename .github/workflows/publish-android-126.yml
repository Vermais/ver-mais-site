name: Publish Android 1.2.6 Guia test APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-126.yml'
      - '.github/release-126/release-notes.md'
      - '.github/release-126/publish.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-android-126
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish the signed Guia test APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/release-126/publish.py
